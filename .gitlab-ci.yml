# onnxruntime CI — 构建 x86_64 Linux、riscv64 Linux 和 riscv64 OHOS SDK。
# 安装产物写入共享目录；设置 NEXUS_USER（用户名:密码）时上传 SDK 归档和 SHA-256 校验文件。
#
# 网页触发并传入 BUILD_COMMIT 时，构建指定提交；build-rv64 额外构建 Python 3.12/3.13/3.14 wheel。
# WHEEL_PYTHON_VERSIONS 可选择其中的版本；runner 的 PATH 中须有对应版本的宿主 Python。
# 同时传入 GITLAB_PYPI_TOKEN 和 GITLAB_PYPI_USERNAME 时上传 wheel。

include:
  - project: 'ai/gitlab-ci-templates'
    file:
      - 'x86-host-env.yml'

stages:
  - build

.build-sdk:
  extends: .x86-host-ci-env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
  stage: build
  tags:
    - 92_13_host
  variables:
    CMAKE_TLS_VERIFY: 0
    GIT_DEPTH: "0"
    # 共享证书包里的 dc.com-CA 也是 Nexus 证书的签发者。
    NEXUS_CA_BUNDLE: "/home/share/nfs_share/ci-node-compiler-env/gitlab-dc-com-ca.pem"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - $CI_JOB_NAME.log
      - build/packages/$CI_JOB_NAME/*.tar.gz
      - build/packages/$CI_JOB_NAME/*.tar.gz.sha256

build-rv64:
  extends: .build-sdk
  variables:
    RISCV_ROOT_PATH: "$DEFAULT_RISCV_ROOT_PATH"
    WHEEL_PYTHON_VERSIONS: "3.12 3.13 3.14"
  script:
    - &setup_build |
      set -euo pipefail
      BUILD_LOG="$CI_PROJECT_DIR/$CI_JOB_NAME.log"
      : > "$BUILD_LOG"

      # 完整构建输出只写文件，失败时显示有限的末尾内容，避免 CI 页面达到日志上限。
      run_build() {
        local build_status
        echo "Build started; full log: $BUILD_LOG"
        if "$@" >> "$BUILD_LOG" 2>&1; then
          echo "Build completed."
        else
          build_status=$?
          echo "Build failed (exit code $build_status). Last 200 lines (up to 64 KiB):"
          tail -n 200 "$BUILD_LOG" | tail -c 65536
          exit "$build_status"
        fi
      }
    - &checkout_build_commit |
      if [ "$CI_PIPELINE_SOURCE" = "web" ] && [ -n "${BUILD_COMMIT:-}" ]; then
        git fetch --no-tags origin
        TARGET_COMMIT=$(git rev-parse --verify --end-of-options "${BUILD_COMMIT}^{commit}")
        git checkout --detach "$TARGET_COMMIT"
        echo "Building commit $TARGET_COMMIT" | tee -a "$BUILD_LOG"
      fi
    - ORI_INSTALL_DIR="$CI_PROJECT_DIR/build/Linux/rv64/Release/installed"
    - WHEEL_DIR="$CI_PROJECT_DIR/build/wheels"
    - |
      if [ "$CI_PIPELINE_SOURCE" = "web" ] && [ -n "${BUILD_COMMIT:-}" ]; then
        PYTHON_ENV_DIR=${PYTHON_ENV_DIR:-$(dirname "$DEFAULT_RISCV_ROOT_PATH")}
        read -ra PYTHON_VERSIONS <<< "${WHEEL_PYTHON_VERSIONS:?Select at least one Python version}"
        test "${#PYTHON_VERSIONS[@]}" -gt 0
        for PYTHON_VERSION in "${PYTHON_VERSIONS[@]}"; do
          case "$PYTHON_VERSION" in
            3.12|3.13|3.14) ;;
            *) echo "Unsupported Python version: $PYTHON_VERSION" >&2; exit 1 ;;
          esac
          test -d "$PYTHON_ENV_DIR/py-riscv64-${PYTHON_VERSION/./}"
          if ! command -v "python$PYTHON_VERSION" > /dev/null; then
            echo "Python $PYTHON_VERSION is required on the build host for the matching wheel ABI." >&2
            exit 1
          fi
        done

        mkdir -p "$WHEEL_DIR"
        rm -f "$WHEEL_DIR"/*.whl
        for PYTHON_VERSION in "${PYTHON_VERSIONS[@]}"; do
          PYTHON_TAG="cp${PYTHON_VERSION/./}"
          HOST_ENV="$CI_PROJECT_DIR/build/venv-$PYTHON_TAG"
          export PYTHON_EXECUTABLE="$HOST_ENV/bin/python"
          export ORT_BUILD_ROOT="$CI_PROJECT_DIR/build/Linux/rv64-$PYTHON_TAG"
          run_build "python$PYTHON_VERSION" -m venv --clear "$HOST_ENV"
          run_build "$PYTHON_EXECUTABLE" -m pip install setuptools wheel packaging numpy
          # 每个 ABI 独立构建；清除旧提交的动态库和打包目录。
          rm -rf "$ORT_BUILD_ROOT"
          echo "Building Python $PYTHON_VERSION" | tee -a "$BUILD_LOG"
          run_build bash -e ./tools/scripts/build_riscv64.spacemit.sh \
            "$CI_PROJECT_DIR" rv64 Release Linux gcc \
            "$PYTHON_ENV_DIR/py-riscv64-${PYTHON_VERSION/./}"
          WHEELS=("$ORT_BUILD_ROOT/Release/dist"/onnxruntime-*-"$PYTHON_TAG"-"$PYTHON_TAG"-linux_riscv64.whl)
          test "${#WHEELS[@]}" -eq 1
          test -f "${WHEELS[0]}"
          cp "${WHEELS[0]}" "$WHEEL_DIR/"
          ORI_INSTALL_DIR="$ORT_BUILD_ROOT/Release/installed"
        done
      else
        run_build bash -e ./tools/scripts/build_riscv64.spacemit.sh "$CI_PROJECT_DIR" rv64 Release
      fi
    - &publish_sdk |
      INSTALL_DIR="$SHARE_INSTALL_DIR/$CI_JOB_NAME/installed"
      test -d "$ORI_INSTALL_DIR"
      mkdir -p "$INSTALL_DIR"
      cp -a "$ORI_INSTALL_DIR"/. "$INSTALL_DIR"/

      PACKAGE_DIR="$CI_PROJECT_DIR/build/packages/$CI_JOB_NAME"
      VERSION=$(tr -d '[:space:]' < "$CI_PROJECT_DIR/VERSION_NUMBER")
      test -n "$VERSION"
      ARCHIVE="onnxruntime-${CI_JOB_NAME#build-}-$VERSION.tar.gz"
      mkdir -p "$PACKAGE_DIR"
      tar -C "$ORI_INSTALL_DIR" -czf "$PACKAGE_DIR/$ARCHIVE" .
      (cd "$PACKAGE_DIR" && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")

      set +x
      if [ -n "${NEXUS_USER:-}" ]; then
        NEXUS_BASE="https://nexus.bianbu.xyz/repository/ai/onnxruntime"
        for file in "$ARCHIVE" "$ARCHIVE.sha256"; do
          echo "Uploading $file to Nexus"
          http_code=$(curl --silent --show-error --cacert "$NEXUS_CA_BUNDLE" --user "$NEXUS_USER" \
            --upload-file "$PACKAGE_DIR/$file" --output /dev/null \
            --write-out '%{http_code}' "$NEXUS_BASE/$file")
          case "$http_code" in
            2??) ;;
            *) echo "Nexus upload failed for $file (HTTP $http_code)" >&2; exit 1 ;;
          esac
        done
      fi
    - |
      set +x
      if [ "$CI_PIPELINE_SOURCE" = "web" ] && [ -n "${BUILD_COMMIT:-}" ] && [ -n "${GITLAB_PYPI_TOKEN:-}" ] && [ -n "${GITLAB_PYPI_USERNAME:-}" ]; then
        run_build "$PYTHON_EXECUTABLE" -m pip install twine
        TWINE_USERNAME="$GITLAB_PYPI_USERNAME" TWINE_PASSWORD="$GITLAB_PYPI_TOKEN" \
          "$PYTHON_EXECUTABLE" -m twine upload --non-interactive \
          --repository-url https://git.spacemit.com/api/v4/projects/33/packages/pypi \
          "$WHEEL_DIR"/*.whl
      fi
  artifacts:
    paths:
      - $CI_JOB_NAME.log
      - build/packages/$CI_JOB_NAME/*.tar.gz
      - build/packages/$CI_JOB_NAME/*.tar.gz.sha256
      - build/wheels/*.whl

.build-sdk-no-python:
  extends: .build-sdk
  script:
    - *setup_build
    - *checkout_build_commit
    - |
      ORT_BUILD_ROOT="$CI_PROJECT_DIR/build/$SDK_OS/$SDK_ARCH"
      ORI_INSTALL_DIR="$ORT_BUILD_ROOT/Release/installed"
      # BUILD_COMMIT 可以早于 ORT_SKIP_PYTHON 开关，构建入口取流水线提交的版本。
      git show "$CI_COMMIT_SHA:tools/scripts/build_riscv64.spacemit.sh" |
        ORT_BUILD_ROOT="$ORT_BUILD_ROOT" ORT_SKIP_PYTHON=1 \
        run_build bash -se -- "$CI_PROJECT_DIR" "$SDK_ARCH" Release "$SDK_OS"
    - *publish_sdk

build-x86_64:
  extends: .build-sdk-no-python
  variables:
    SDK_ARCH: x86
    SDK_OS: Linux

build-rv64-ohos:
  extends: .build-sdk-no-python
  variables:
    SDK_ARCH: rv64
    SDK_OS: OHOS
    DEFAULT_OHOS_RISCV_ROOT_PATH: "/home/share/nfs_share/ci-node-compiler-env/spacemit-toolchain-linux-musl-x86_64-oh-20260630"
    RISCV_ROOT_PATH: "$DEFAULT_OHOS_RISCV_ROOT_PATH"
